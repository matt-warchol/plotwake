name: Bug report
description: A reproducible problem in Plotwake
body:
  - type: markdown
    attributes:
      value: Never include connection keys, .env files, databases or private analytics exports. For security issues, use SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plotwake version, Node version and browser
